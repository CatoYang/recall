- id: sort-dc-merge-linked-lists
  topic: sorting-divide-conquer
  difficulty: 2
  prompt: |
    Why is Merge Sort uniquely well-suited for sorting Linked Lists compared to its performance on contiguous arrays?
  answer: |
    While Merge Sort requires $O(n)$ auxiliary space to sort contiguous arrays (for the temporary arrays during the merge step), it can sort Linked Lists in-place with $O(1)$ extra space because pointers can simply be rearranged during the merge step.
  rubric:
    - "Can sort Linked Lists in-place (O(1) extra space)"
    - "Pointers can be rearranged directly during the merge step"
  provenance:
