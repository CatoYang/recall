- id: sort-dc-quick-vs-merge
  topic: sorting-divide-conquer
  difficulty: 2
  prompt: |
    Despite the risk of an $O(n^2)$ worst-case, why is Quick Sort often heavily preferred in practice over Merge Sort for contiguous arrays?
  answer: |
    Quick Sort is often preferred because it operates **in-place** (requiring no $O(n)$ memory allocation) and has extremely good **cache locality** (the CPU cache easily predicts and loads the sequential memory access during partitioning), leading to much smaller constant factors in its execution time.
  rubric:
    - "Operates in-place (no O(n) memory allocation)"
    - "Extremely good cache locality (or sequential memory access)"
