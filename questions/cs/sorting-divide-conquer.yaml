- id: sort-dc-merge-mechanism
  topic: sorting-divide-conquer
  difficulty: 1
  prompt: |
    Briefly describe the divide and conquer mechanism of Merge Sort and state its time and space complexity.
  answer: |
    Merge sort recursively divides an array in half until it reaches sub-arrays of size 1. It then repeatedly merges those sorted sub-arrays back together in the correct order. 
    Time complexity: $O(n \log n)$. 
    Space complexity: $O(n)$ (out-of-place).
  rubric:
    - "Recursively divides array in half"
    - "Merges sorted sub-arrays back together"
    - "Time complexity: O(n log n)"
    - "Space complexity: O(n)"
  provenance:
