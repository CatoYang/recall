- id: sort-dc-quick-worst-case
  topic: sorting-divide-conquer
  difficulty: 2
  prompt: |
    What is the worst-case time complexity of Quick Sort, and under what specific condition does this catastrophic degradation occur?
  answer: |
    The worst-case time complexity is $O(n^2)$. This occurs when poor pivots are chosen (e.g., always picking the first or last element) on an array that is already sorted or reverse-sorted. This causes the array to be partitioned into highly unbalanced sizes of $1$ and $n-1$, degrading the recursion tree depth from $O(\log n)$ to $O(n)$.
  rubric:
    - "Worst-case is O(n^2)"
    - "Occurs when poor pivots are chosen on an already sorted or reverse-sorted array"
    - "Causes unbalanced partitions (or degrades recursion depth to O(n))"
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Algorithms/IV. Sorting and Searching Algorithms/Sorting/03_Divide_and_Conquer_Sorts.md"
