- id: sort-ds-heap-mechanism
  topic: sorting-data-structure
  difficulty: 1
  prompt: |
    Briefly describe the mechanism of Heap Sort and state its worst-case time and space complexity.
  answer: |
    Heap Sort transforms the input array into a Binary Max-Heap, repeatedly extracts the maximum element (placing it at the end of the array), and sifts down the new root to restore the heap property.
    Time complexity: $O(n \log n)$ worst-case.
    Space complexity: $O(1)$ (in-place).
  rubric:
    - "Transforms the array into a Binary Max-Heap"
    - "Repeatedly extracts the maximum element and restores the heap property"
    - "Time complexity: O(n log n)"
    - "Space complexity: O(1)"
  provenance:
    status: unverified
