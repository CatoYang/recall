- id: sort-ds-tree-sort-degradation
  topic: sorting-data-structure
  difficulty: 2
  prompt: |
    What is the worst-case time complexity of standard Tree Sort, and under what condition does it occur?
  answer: |
    The worst-case time complexity is $O(n^2)$. This occurs if the input data is already sorted (or reverse sorted) and is inserted into a standard Binary Search Tree, causing the tree to become completely unbalanced (degrading into a linked list) and making each insertion take $O(n)$ time.
  rubric:
    - "Worst-case time complexity is O(n^2)"
    - "Occurs when data is already sorted (or reverse sorted)"
    - "Causes the tree to become completely unbalanced (or degrade into a linked list)"
