- id: sort-ds-heap-vs-quick
  topic: sorting-data-structure
  difficulty: 2
  prompt: |
    Why is Heap Sort often used as a fallback safety algorithm for Quick Sort in production environments (like C++'s `std::sort`), even though it is generally slower in practice?
  answer: |
    While Heap Sort is generally slower than Quick Sort due to poor CPU cache locality, it is mathematically guaranteed to run in $O(n \log n)$ time even in the worst-case scenario, acting as a perfect safety net to prevent Quick Sort's catastrophic $O(n^2)$ degradation.
  rubric:
    - "Guaranteed to run in O(n log n) time in the worst-case scenario"
    - "Acts as a safety net to prevent Quick Sort's O(n^2) worst-case degradation"
  provenance:
