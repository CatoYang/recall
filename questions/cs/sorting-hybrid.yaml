- id: sort-hybrid-introsort-finisher
  topic: sorting-hybrid
  difficulty: 2
  prompt: |
    In the Introsort algorithm, why does it deliberately stop Quick Sort partitioning when sub-arrays become very small (e.g., fewer than 16 elements)?
  answer: |
    Introsort stops partitioning small sub-arrays to avoid the recursive overhead of Quick Sort on tiny datasets. It leaves these small chunks unsorted and, at the very end of the entire process, runs a single massive pass of **Insertion Sort** over the entire array. Insertion Sort is incredibly fast at cleaning up local, small-scale disorder in $O(n)$ time.
  rubric:
    - "To avoid the recursive overhead of Quick Sort on tiny datasets"
    - "Leaves small chunks unsorted to be cleaned up by a final pass of Insertion Sort"
