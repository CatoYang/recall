- id: sort-hybrid-introsort-watchdog
  topic: sorting-hybrid
  difficulty: 2
  prompt: |
    In the Introsort algorithm (used in C++ `std::sort`), what specific role does Heap Sort play?
  answer: |
    Heap Sort acts as a "watchdog" or safety net. The algorithm primarily uses Quick Sort for sheer speed, but if it detects that the Quick Sort recursion depth has exceeded a certain limit (indicating poor pivots and a slide toward $O(n^2)$ worst-case performance), it immediately halts the Quick Sort recursion and switches to Heap Sort to guarantee an $O(n \log n)$ finish.
  rubric:
    - "Acts as a watchdog or safety net"
    - "Takes over if Quick Sort recursion depth exceeds a limit"
    - "Guarantees an O(n log n) worst-case finish"
  provenance:
