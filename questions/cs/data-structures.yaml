- id: cs-ds-array-vs-linked-list
  topic: data-structures
  difficulty: 2
  prompt: |
    Compare the time complexity of element access and middle-insertion for dynamic arrays versus linked lists.
  answer: |
    Dynamic arrays provide O(1) time complexity for access/indexing but O(n) for insertion in the middle, because subsequent elements must be shifted. Linked lists have O(n) complexity for access (requiring traversal from the head) but O(1) complexity for insertion if the target node location is already known.
  rubric:
    - "Array: O(1) access, O(n) middle insertion due to shifting"
    - "Linked List: O(n) access, O(1) insertion if the target node is known"
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md."
    vault_ref: "02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md"
  tags: [data-structures, arrays, linked-lists, complexity]

- id: cs-ds-dynamic-array-amortized
  topic: data-structures
  difficulty: 2
  prompt: |
    Why is insertion at the end of a dynamic array considered O(1) *amortized*?
  answer: |
    Most insertions at the end of a dynamic array take O(1) time. However, when the array reaches its current capacity limit, it must allocate a new, larger block of memory and copy all existing elements over, which takes O(n) time. Because this expensive resize operation happens infrequently (usually doubling capacity), averaging the cost over a sequence of insertions results in a constant O(1) cost per operation.
  rubric:
    - Explains that most insertions are simple O(1) operations
    - Mentions that hitting capacity triggers an O(n) resize and copy operation
    - Notes that averaging the costly resize over many fast insertions yields an O(1) amortized cost
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md."
    vault_ref: "02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md"
  tags: [data-structures, arrays, amortized-analysis]
