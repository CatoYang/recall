- id: cs-ds-vs-adt
  topic: data-structures
  difficulty: 2
  prompt: |
    What is the fundamental difference between a Data Structure and an Abstract Data Type (ADT)?
  answer: |
    A Data Structure defines how data is actually organized and stored in memory (the physical structural layout). An Abstract Data Type (ADT) defines only the expected behavior, operations, and interface, leaving the physical implementation details to a specific underlying data structure.
  rubric:
    - States that data structures dictate physical memory layout or organization
    - States that ADTs define behavior, operations, or interfaces without dictating implementation
  provenance:
    status: unverified
