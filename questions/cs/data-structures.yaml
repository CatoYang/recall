- id: cs-ds-pointer-vs-reference
  topic: data-structures
  difficulty: 2
  prompt: |
    In computer science, what are the key differences between a pointer and a reference?
  answer: |
    Both store memory addresses, but a pointer is a distinct variable that holds a raw memory address and typically supports pointer arithmetic. A reference acts as an alias to an existing variable, cannot be reassigned to point to something else once initialized (in many languages like C++), and does not support memory arithmetic.
  rubric:
    - Identifies a pointer as holding raw memory addresses and supporting arithmetic
    - Identifies a reference as an alias that cannot be reassigned or perform arithmetic
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md."
    vault_ref: "02_Computer_Science_Fundamentals/Data Structures/Primitive_and_Linear_Structures_Consolidated.md"
