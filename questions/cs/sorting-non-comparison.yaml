- id: sort-nc-counting-sort-memory
  topic: sorting-non-comparison
  difficulty: 2
  prompt: |
    What is the primary architectural limitation or "catch" of Counting Sort that restricts its real-world use?
  answer: |
    Counting Sort's memory requirement scales with the *maximum value* in the array, not just the number of elements. Sorting a tiny array containing one massive value (e.g., 1,000,000) will force the algorithm to allocate a massive counting array, causing extreme memory inefficiency if the range of values ($k$) is much larger than the number of elements ($n$).
  rubric:
    - "Memory scales with the maximum value (or range of values)"
    - "Can cause massive memory allocation even for tiny input arrays if values are large"
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Algorithms/IV. Sorting and Searching Algorithms/Sorting/05_Non_Comparison_Sorts.md"
