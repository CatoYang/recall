- id: sort-nc-linear-condition
  topic: sorting-non-comparison
  difficulty: 2
  prompt: |
    Under what specific condition is it mathematically possible to bypass the $\Omega(n \log n)$ theoretical lower bound and sort data in $O(n)$ linear time?
  answer: |
    It is possible to achieve $O(n)$ linear time if you have prior knowledge about the data (e.g., knowing all elements are integers within a specific, restricted range). This allows the algorithm to bypass element-to-element comparisons entirely and use the values themselves as array indices.
  rubric:
    - "If you have prior knowledge about the data (e.g., restricted integer range)"
    - "Bypasses element-to-element comparisons"
  provenance:
