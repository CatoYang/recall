- id: sort-nc-bucket-sort-distribution
  topic: sorting-non-comparison
  difficulty: 2
  prompt: |
    For Bucket Sort to achieve its average-case time complexity of $O(n + k)$, what specific property should the input data possess?
  answer: |
    The input data must be uniformly distributed over a known range. If the data is uniformly distributed, elements scatter evenly across the buckets, preventing any single bucket from becoming overloaded and degrading performance to the $O(n^2)$ worst case.
  rubric:
    - "Data should be uniformly distributed"
    - "Prevents elements from clustering into a single bucket (which causes O(n^2) degradation)"
  provenance:
