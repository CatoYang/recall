- id: sort-nc-radix-sort-mechanics
  topic: sorting-non-comparison
  difficulty: 2
  prompt: |
    Briefly describe the mechanism of Radix Sort (LSD) and why it relies on a stable sorting subroutine.
  answer: |
    Radix Sort sorts large integers digit by digit, usually starting from the least significant digit (LSD) up to the most. It strictly requires a stable sorting subroutine (like Counting Sort) so that when sorting higher-order digits, the relative order of numbers established by the lower-order digits is preserved.
  rubric:
    - "Sorts integers digit by digit"
    - "Requires a stable subroutine to preserve the relative order established by previously sorted digits"
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Algorithms/IV. Sorting and Searching Algorithms/Sorting/05_Non_Comparison_Sorts.md"
