- id: sort-elem-insertion-adaptivity
  topic: sorting-elementary
  difficulty: 2
  prompt: |
    What is the best-case time complexity of Insertion Sort, and under what specific condition does it occur?
  answer: |
    The best-case time complexity is $O(n)$. This occurs when the input array is already perfectly sorted, as the algorithm only needs to make one comparison per element to verify it is in the correct position without shifting anything.
  rubric:
    - "O(n) (or linear time)"
    - "Occurs when the array is already sorted"
