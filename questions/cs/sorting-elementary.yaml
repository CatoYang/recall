- id: sort-elem-selection-swaps
  topic: sorting-elementary
  difficulty: 2
  prompt: |
    Why might Selection Sort be preferred over other $O(n^2)$ sorting algorithms in embedded systems with costly memory write operations?
  answer: |
    Selection Sort performs exactly $O(n)$ swaps in all cases, minimizing the number of memory write operations compared to other algorithms (like Bubble or Insertion sort) which may perform $O(n^2)$ writes.
  rubric:
    - "Performs exactly O(n) swaps (or minimizes memory writes)"
    - "Better for systems where writing to memory is highly expensive"
  provenance:
