- id: sort-elem-selection-stability
  topic: sorting-elementary
  difficulty: 2
  prompt: |
    Is Selection Sort generally considered a stable sorting algorithm? Briefly explain why or why not.
  answer: |
    No, Selection Sort is generally unstable. This is because swapping the minimum element found in the unsorted region across long distances can easily jump over and disrupt the relative order of other equal elements.
  rubric:
    - "No (unstable)"
    - "Swapping elements across long distances disrupts the relative order of equal elements"
