- id: sort-elem-bubble-mechanism
  topic: sorting-elementary
  difficulty: 1
  prompt: |
    Briefly describe the mechanism of Bubble Sort and state its worst-case time complexity.
  answer: |
    Bubble sort repeatedly steps through the list, compares adjacent elements, and swaps them if they are in the wrong order. This causes the largest elements to "bubble" to the end. Its worst-case time complexity is $O(n^2)$.
  rubric:
    - "Compares adjacent elements and swaps them if they are in the wrong order"
    - "Worst-case time complexity is O(n^2)"
