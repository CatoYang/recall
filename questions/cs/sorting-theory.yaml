- id: sort-theory-adaptivity
  topic: sorting-theory
  difficulty: 2
  prompt: |
    What does it mean for a sorting algorithm to be "adaptive", and why is this useful for real-world data?
  answer: |
    An adaptive algorithm's execution time improves when the input array is already partially sorted. This is useful because real-world data is rarely purely random and often contains pre-sorted sequences (runs) that an adaptive algorithm can exploit to finish faster.
  rubric:
    - "Execution time improves when the input is partially sorted"
    - "Exploits naturally occurring pre-sorted sequences (runs) in real-world data"
  provenance:
