- id: sort-theory-stability
  topic: sorting-theory
  difficulty: 1
  prompt: |
    In the context of sorting algorithms, what does it mean for an algorithm to be "stable"?
  answer: |
    A stable sorting algorithm preserves the relative order of equal elements in the sorted output. If two elements have the same key, their original sequential order in the input is maintained.
  rubric:
    - "Preserves the relative order"
    - "Of equal elements (or elements with the same key)"
  provenance:
