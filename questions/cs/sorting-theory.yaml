- id: sort-theory-in-place
  topic: sorting-theory
  difficulty: 1
  prompt: |
    What defines an "in-place" sorting algorithm, and why is this property important in practice?
  answer: |
    An in-place sorting algorithm transforms the input data structure using only a small, constant amount of extra memory space (typically `O(1)` or `O(log n)` auxiliary space). It is important because allocating an entirely new array for massive datasets can cause memory exhaustion.
  rubric:
    - "Uses a small, constant amount of extra memory space (O(1) auxiliary space)"
    - "Important to prevent memory exhaustion on large datasets"
  provenance:
    status: unverified
    source: "vault note: 02_Computer_Science_Fundamentals/Algorithms/IV. Sorting and Searching Algorithms/Sorting/01_Sorting_Theory_and_Bounds.md"
