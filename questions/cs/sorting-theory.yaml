- id: sort-theory-lower-bound
  topic: sorting-theory
  difficulty: 2
  prompt: |
    What is the absolute fastest worst-case time complexity that any comparison-based sorting algorithm can achieve, and what mathematical model is typically used to prove this?
  answer: |
    The absolute fastest worst-case time complexity is $\Omega(n \log n)$. This limit is proven mathematically using the **Decision Tree Model**, which shows that a binary tree resolving $n!$ permutations must have a height of at least $\Omega(n \log n)$.
  rubric:
    - "Omega(n log n) or O(n log n)"
    - "Proven using the Decision Tree Model"
  provenance:
    status: unverified
