- id: l1-vs-l2-regularisation
  topic: regularisation
  difficulty: 1
  prompt: |
    Compare the effects of L1 (Lasso) and L2 (Ridge) regularisation on a model's weights.
  answer: |
    **L1 Regularisation (Lasso)** adds a penalty equal to the absolute value of the weights ($\sum |w_i|$). Its primary effect is inducing **sparsity** by pushing the weights of less important features exactly to zero, effectively performing feature selection.

    **L2 Regularisation (Ridge)** adds a penalty equal to the square of the weights ($\sum w_i^2$). Its primary effect is **weight decay**. It penalizes large weights heavily, shrinking them toward zero but rarely exactly to zero, keeping them uniformly small to prevent any single feature from dominating.
  rubric:
    - States L1 adds an absolute value penalty and induces sparsity (pushes weights to zero)
    - States L2 adds a squared penalty and induces weight decay (shrinks weights but rarely to exactly zero)
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Regularisation_and_Optimization/Regularisation.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Regularisation_and_Optimization/Regularisation.md"
  tags: [l1, l2, regularisation, lasso, ridge]

- id: regularisation-bayesian-priors
  topic: regularisation
  difficulty: 2
  prompt: |
    What are the equivalent Bayesian priors for L1 and L2 regularisation?
  answer: |
    - **L1 Regularisation** is mathematically equivalent to placing a **Laplacian Prior** on the model's weights.
    - **L2 Regularisation** is mathematically equivalent to placing a **Gaussian Prior** on the model's weights.
  rubric:
    - Identifies Laplacian prior for L1 regularisation
    - Identifies Gaussian prior for L2 regularisation
  provenance:
