  tags: [machine-learning, evaluation, probability]

- id: ml-eval-domain-classifier-drift
  topic: robustness-and-drift
  difficulty: 2
  prompt: |
    How can a "Domain Classifier" be used as a multivariate technique to detect data drift between a training set and a production set?
  answer: |
    A Domain Classifier is trained on a combined dataset of both training and production data, where the target label is the origin of the data (e.g., 0 for training, 1 for production). If the classifier can accurately distinguish between the two sets (i.e., it has a high AUC), it indicates significant multivariate data drift has occurred between the environments.
  rubric:
    - "Train a classifier to predict whether a data point belongs to the training set or the production set"
    - "If the classifier performs well (can distinguish the sets), it indicates significant data drift"
  provenance:
    status: unverified
    source: "vault note: 06_Model_Evaluation_and_Post_Processing/Fairness_Robustness_and_Drift/03_Robustness_Generalization_and_Drift.md."
    vault_ref: "06_Model_Evaluation_and_Post_Processing/Fairness_Robustness_and_Drift/03_Robustness_Generalization_and_Drift.md"
  tags: [machine-learning, evaluation, drift-detection]
