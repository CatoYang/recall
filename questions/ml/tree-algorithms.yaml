- id: ml-tree-rf-randomness
  topic: tree-algorithms
  difficulty: 2
  prompt: |
    What are the two distinct mechanisms of randomness introduced in a Random Forest to ensure the individual trees are de-correlated?
  answer: |
    1. **Data Bagging (Bootstrap Aggregating):** Each tree is trained on a random sample of the dataset drawn with replacement.
    2. **Feature Randomness:** At every node split, only a random subset of all available features is considered, preventing highly predictive features from dominating every tree.
  rubric:
    - "Data bagging or bootstrapping (sampling data with replacement)"
    - "Feature randomness or sub-sampling features at each node split"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md"
  tags: [machine-learning, random-forest, ensemble]

- id: ml-tree-lightgbm-growth
  topic: tree-algorithms
  difficulty: 2
  prompt: |
    How does the tree growth strategy of LightGBM fundamentally differ from the standard approach used in XGBoost, and what risk does it introduce?
  answer: |
    LightGBM uses a **leaf-wise (best-first)** growth strategy, meaning it splits the single leaf that offers the maximum loss reduction, resulting in deeper, asymmetrical trees. Standard XGBoost uses **level-wise** growth, building the tree one full level at a time. The leaf-wise approach converges faster but is more prone to overfitting, requiring strict max-depth or leaf limits.
  rubric:
    - "LightGBM uses leaf-wise (best-first) growth"
    - "XGBoost uses level-wise growth"
    - "Leaf-wise growth increases the risk of overfitting (without depth constraints)"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md"
  tags: [machine-learning, gradient-boosting, lightgbm, xgboost]

- id: ml-tree-catboost-symmetric
  topic: tree-algorithms
  difficulty: 2
  prompt: |
    What does it mean that CatBoost builds "symmetric" (or oblivious) trees, and what is the primary advantage of this structure?
  answer: |
    Symmetric trees mean that the exact same splitting criterion (feature and threshold) is applied across all nodes at the same depth level of the tree. The primary advantage of this structure is that it makes prediction/inference incredibly fast, as the path can be computed using simple bitwise operations rather than deep conditional branching.
  rubric:
    - "The same split criterion is used for all nodes at a given depth level"
    - "It significantly speeds up inference or prediction time"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md"
  tags: [machine-learning, catboost, decision-trees]
