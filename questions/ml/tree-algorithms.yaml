- id: ml-tree-c45-gain-ratio
  topic: tree-algorithms
  difficulty: 2
  prompt: |
    Why does the C4.5 decision tree algorithm use Gain Ratio instead of ID3's Information Gain for choosing splits?
  answer: |
    Information Gain is biased toward features with a large number of distinct values (e.g., ID columns or categorical variables with high cardinality). C4.5 uses Gain Ratio to penalize such features, effectively normalizing the Information Gain by the intrinsic entropy of the feature split.
  rubric:
    - "Information Gain is biased toward features with many distinct values (high cardinality)"
    - "Gain Ratio penalizes or normalizes based on the number of feature categories"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md"
  tags: [machine-learning, decision-trees, algorithms]

- id: ml-tree-cart-branching
  topic: tree-algorithms
  difficulty: 1
  prompt: |
    What is a structural difference between trees constructed by the CART algorithm and those constructed by C4.5 regarding branching?
  answer: |
    CART constructs strictly binary trees, meaning every internal node splits into exactly two branches. In contrast, C4.5 can create multi-way splits for categorical features with multiple classes.
  rubric:
    - "CART creates strictly binary trees (two branches per node)"
    - "C4.5 can create multi-way (more than two) branches"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Algorithms.md."
