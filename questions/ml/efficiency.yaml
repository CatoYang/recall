- id: ml-eval-memory-optimization-techniques
  topic: efficiency
  difficulty: 1
  prompt: |
    What are three common optimization techniques used specifically to reduce a model's memory footprint (size) for deployment on edge devices?
  answer: |
    Three common techniques directly targeting memory reduction are quantization, pruning, and knowledge distillation.
