- id: ml-opt-momentum-purpose
  topic: optimisers
  difficulty: 2
  prompt: |
    How does Momentum optimization address the oscillation problem commonly seen in standard Stochastic Gradient Descent (SGD)?
  answer: |
    Momentum addresses oscillation in narrow ravines (steep surfaces) by accumulating an exponentially decaying moving average of past gradients. This mechanism dampens oscillations across steep directions and accelerates movement along consistent directions, leading to faster, more stable convergence.
  rubric:
    - "It accumulates an exponentially decaying moving average of past gradients"
    - "It dampens oscillations and accelerates consistent directions"
  provenance:
    status: unverified
