- id: ml-opt-adafactor-advantage
  topic: optimisers
  difficulty: 3
  prompt: |
    What is the primary advantage of the Adafactor optimizer over Adam, particularly when training Large Language Models (LLMs)?
  answer: |
    The primary advantage of Adafactor is its significantly reduced memory footprint. While Adam stores two full state variables (momentum and variance) for every parameter, Adafactor replaces the full variance matrix with a factored representation (row and column sums), which heavily saves memory during massive model training.
  rubric:
    - "Adafactor significantly reduces the memory footprint"
    - "It does this by factoring the variance state matrix instead of storing full states for every parameter"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Neural_Networks_and_Deep_Learning/Optimisers.md."
