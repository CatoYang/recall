- id: ml-fair-counterfactual-fairness
  topic: fairness-and-bias
  difficulty: 1
  prompt: |
    What does the concept of "Counterfactual Fairness" require for an individual's prediction?
  answer: |
    Counterfactual Fairness requires that an individual's prediction remains identical if their protected attribute (e.g., race, gender) were altered, while holding all other causal factors constant.
  rubric:
    - "The prediction must remain identical if the protected attribute is altered"
    - "All other causal factors are held constant"
  provenance:
