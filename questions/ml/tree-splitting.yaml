- id: ml-tree-split-gini-impurity
  topic: tree-splitting
  difficulty: 2
  prompt: |
    Why is Gini Impurity computationally faster to calculate than Information Gain (Entropy) when building decision trees?
  answer: |
    Gini Impurity is computationally faster because it only requires basic arithmetic and calculating squares (using $\sum p_i^2$), whereas calculating Entropy requires computing logarithms ($- \sum p_i \log_2(p_i)$), which is a much more computationally expensive operation.
  rubric:
    - "Gini only requires calculating squares or basic arithmetic"
    - "Entropy requires computing logarithms, which is computationally heavier"
  provenance:
