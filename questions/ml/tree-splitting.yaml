    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Splitting_and_Strategies.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Splitting_and_Strategies.md"
