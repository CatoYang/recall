- id: ml-tree-loss-mae-vs-mse-leaves
  topic: tree-loss-functions
  difficulty: 2
  prompt: |
    In Gradient Boosted Models (GBMs), how does the choice between Mean Absolute Error (MAE) and Mean Squared Error (MSE) change the optimal prediction value calculated at each terminal leaf node?
  answer: |
    When minimizing Mean Squared Error (MSE), the optimal prediction value for a leaf is the **mean** of the target values in that leaf. When minimizing Mean Absolute Error (MAE), the optimal prediction value for a leaf is the **median** of the target values.
  rubric:
    - "MSE optimal leaf weight is the mean of the values"
    - "MAE optimal leaf weight is the median of the values"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Loss_Functions.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Loss_Functions.md"
