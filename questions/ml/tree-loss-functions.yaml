- id: ml-tree-loss-huber-hybrid
  topic: tree-loss-functions
  difficulty: 2
  prompt: |
    How does Huber Loss act as a hybrid loss function in gradient boosting?
  answer: |
    Huber Loss requires a hyperparameter threshold ($\delta$). For errors smaller than this threshold, it applies a quadratic penalty like Mean Squared Error (MSE), providing smooth gradients near the minimum. For errors larger than this threshold, it applies a linear penalty like Mean Absolute Error (MAE), ensuring the model remains robust to severe outliers.
  rubric:
    - "Acts like MSE (quadratic penalty) for small errors"
    - "Acts like MAE (linear penalty) for large errors/outliers"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Loss_Functions.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Loss_Functions.md"
  tags: [machine-learning, decision-trees, loss-functions]

- id: ml-tree-loss-quantile-asymmetry
  topic: tree-loss-functions
  difficulty: 2
  prompt: |
    What is the primary purpose of using Quantile Loss in a gradient boosted model, and how does it mathematically achieve this?
  answer: |
    The primary purpose of Quantile Loss is to predict a specific percentile of the target distribution (e.g., the 90th percentile) rather than the mean. It achieves this by applying an asymmetric penalty to errors; for example, if predicting the 90th percentile, it penalizes under-predictions heavily while penalizing over-predictions very lightly.
  rubric:
    - "Used to predict a specific percentile or quantile (not the mean)"
    - "Achieves this by applying an asymmetric penalty to errors (differing penalties for over vs under prediction)"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Tree_and_Rule_Based_Models/Tree_Loss_Functions.md."
