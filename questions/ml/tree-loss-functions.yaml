- id: ml-tree-loss-cox
  topic: tree-loss-functions
  difficulty: 1
  prompt: |
    In what specific analytical domain would you configure a gradient boosted model to use Cox Proportional Hazards as the loss function?
  answer: |
    Cox Proportional Hazards is used for survival analysis (time-to-event modeling). It is required when modeling the time until a specific event occurs while explicitly handling "censored" data (cases where the observation period ended before the event actually occurred).
  rubric:
    - "Survival analysis or time-to-event modeling"
    - "Handling censored data"
