- id: ml-grad-exploding-consequences
  topic: gradients
  difficulty: 1
  prompt: |
    What are two primary consequences of the exploding gradient problem during neural network training?
  answer: |
    1. The optimizer takes massive, unstable steps that completely overshoot the loss minimum, causing training to diverge.
    2. The weights can grow so large that they cause numerical overflow, resulting in `NaN` (Not a Number) values and a complete crash of the model state.
  rubric:
    - "The optimizer overshoots the minimum, causing unstable training or divergence"
    - "Weights grow too large, causing numerical overflow or NaN values"
  provenance:
