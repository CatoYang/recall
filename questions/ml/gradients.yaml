- id: ml-grad-vanishing-sigmoid-mechanism
  topic: gradients
  difficulty: 2
  prompt: |
    How do saturating activation functions like Sigmoid or Tanh contribute to the vanishing gradient problem in deep neural networks?
  answer: |
    Saturating activation functions squish large input values into very small output ranges, flattening out at the extremes. In these saturated regions, the derivative of the activation function is extremely close to zero. During backpropagation, multiplying these near-zero derivatives across many layers causes the gradient to decay exponentially, effectively vanishing before it reaches the early layers.
  rubric:
    - "Saturating functions have derivatives very close to zero at their extremes"
    - "Multiplying these near-zero derivatives across multiple layers causes exponential decay of the gradient"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Neural_Networks_and_Deep_Learning/Vanishing_and_Exploding_Gradients.md."
    vault_ref: "07_Advanced_Models_and_Architectures/Neural_Networks_and_Deep_Learning/Vanishing_and_Exploding_Gradients.md"
  tags: [machine-learning, gradients, deep-learning]

- id: ml-grad-resnet-solution
  topic: gradients
  difficulty: 1
  prompt: |
    How do Residual Connections (as used in ResNets) help solve the vanishing gradient problem?
  answer: |
    Residual connections provide an identity shortcut that allows the gradient to bypass layers entirely during backpropagation. This additive path mitigates the multiplicative decay caused by the chain rule, allowing a strong gradient signal to reach the early layers of deep networks.
  rubric:
    - "They provide an identity shortcut or bypass for the gradient"
    - "This creates an additive path that avoids the multiplicative decay of standard backpropagation"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Neural_Networks_and_Deep_Learning/Vanishing_and_Exploding_Gradients.md."
