- id: ml-grad-clipping-mechanism
  topic: gradients
  difficulty: 2
  prompt: |
    What is Gradient Clipping and how is it mathematically applied to prevent exploding gradients?
  answer: |
    Gradient Clipping explicitly caps the magnitude of gradients during backpropagation. Typically, if the L2 norm (the length) of the gradient vector exceeds a predefined threshold, the entire gradient vector is scaled down proportionately so that its norm exactly equals that threshold, preserving the direction but reducing the step size.
  rubric:
    - "It explicitly caps or limits the magnitude of the gradients"
    - "If the L2 norm exceeds a threshold, the gradient is scaled down to match the threshold (preserving direction)"
  provenance:
    status: unverified
    source: "vault note: 07_Advanced_Models_and_Architectures/Neural_Networks_and_Deep_Learning/Vanishing_and_Exploding_Gradients.md."
